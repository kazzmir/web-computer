name: Publish playground to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt an in-progress Pages deployment.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build browser application
        run: ./web/build.sh

      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/pages"
          mkdir -p "$site"
          cp web/*.html web/*.css web/*.js web/web-computer.wasm web/LICENSE-Go "$site/"
          cp -R web/examples "$site/examples"
          touch "$site/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
